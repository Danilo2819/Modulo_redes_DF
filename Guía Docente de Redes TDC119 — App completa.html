d h3{margin:0 0 7px;font-size:17px}.card p{margin:5px 0 17px;color:var(--muted);font-size:14px}.ra1{border-top:3px solid var(--primary)}.ra2{border-top:3px solid var(--green)}.ra3{border-top:3px solid var(--orange)}.section{margin:18px 0;padding:23px}.section h2{margin:0 0 14px;color:#eaf0ff;font-size:21px;letter-spacing:-.025em}.section h3{margin:18px 0 7px;color:#aebeff;font-size:15px}.section p{color:#b1bed0}.class-head{margin-bottom:18px;padding:25px;border-left:4px solid var(--primary)}.class-head h1{margin:0;font-size:clamp(22px,3vw,31px);line-height:1.2;letter-spacing:-.045em}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pill{display:inline-flex;padding:5px 10px;color:#bcc8ff;background:#6d8cff1f;border:1px solid #6d8cff40;border-radius:999px;font-size:11px;font-weight:800}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.steps{counter-reset:step;padding:0;list-style:none}.steps li{position:relative;margin:12px 0;padding:14px 15px 14px 50px;color:#b7c3d5;background:var(--panel2);border:1px solid #1b2637;border-radius:12px}.steps li:before{position:absolute;top:12px;left:13px;display:grid;width:25px;height:25px;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--cyan));border-radius:50%;content:counter(step);counter-increment:step;font-size:12px;font-weight:850}.callout{margin:12px 0;padding:14px 16px;color:#c4d2e9;background:#6d8cff17;border:1px solid #6d8cff33;border-left:4px solid var(--primary);border-radius:12px}.good{background:#32d58314;border-color:#32d5833b;border-left-color:var(--green)}.warn{background:#ffb45414;border-color:#ffb4543b;border-left-color:var(--orange)}pre,.diagram{position:relative;overflow:auto;padding:18px;color:#b8f7df;background:#080d16;border:1px solid #1c3040;border-radius:13px;font-family:Consolas,monospace;font-size:12px}.diagram{color:#8cebd2;white-space:pre}.copy{position:absolute;top:9px;right:9px;padding:6px 9px;color:#cbd7eb;background:#1c2b40;border:1px solid #334762;border-radius:7px;cursor:pointer;font-size:10px;font-weight:800}.checklist label{display:block;padding:11px 4px;color:#aebbd0;border-bottom:1px solid #1b2637;cursor:pointer}input[type=checkbox]{width:16px;height:16px;margin-right:9px;vertical-align:-3px;accent-color:var(--primary)}table{width:100%;border-collapse:separate;border-spacing:0;color:#b5c1d2;border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{padding:12px;text-align:left;border-bottom:1px solid #1b2637}th{color:#dbe5ff;background:#17243a;font-size:12px}tr:last-child td{border-bottom:0}tr:hover td{background:#6d8cff0a}code{padding:2px 5px;color:#8eeed4;background:#0a111d;border-radius:5px;font-family:Consolas,monospace;font-size:.9em}.empty{padding:55px 20px;color:var(--muted);text-align:center}.class-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.student-mode .teacher-only{display:none}::selection{color:#fff;background:#526ff0}@media(max-width:1050px){.sidebar{width:245px}.main{width:calc(100% - 245px);margin-left:245px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}.sidebar{position:relative;width:100%;border-right:0;border-bottom:1px solid #1b2637}.main{width:100%;margin:0;padding:20px 15px 45px}.topbar{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}.hero{padding:28px 22px}}@media(max-width:470px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat,.section,.class-head{padding:16px}.class-nav{flex-direction:column}.class-nav button{width:100%}th,td{padding:9px 7px;font-size:12px}}

];
const commands=['enable','configure terminal','show running-config','show ip interface brief','show vlan brief','show interfaces trunk','show ip route','show arp','copy running-config startup-config'];
function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function code(s){return `<pre><button class="copy" onclick="copyCode(this)">COPIAR</button>${esc(s)}</pre>`}
function check(text,key){return `<label><input type="checkbox" data-check="${key}">${text}</label>`}
function baseCode(c){if(c.n===10)return code(`enable\nconfigure terminal\nvlan 10\nname ADMIN\nexit\nvlan 20\nname ALUMNOS\nexit\ninterface fastEthernet 0/1\nswitchport mode access\nswitchport access vlan 10\nexit\ninterface fastEthernet 0/2\nswitchport mode access\nswitchport access vlan 20\nend\nshow vlan brief`);if(c.n===11)return code(`enable\nconfigure terminal\ninterface fastEthernet 0/24\nswitchport mode trunk\nend\nshow interfaces trunk`);if(c.n===4)return code(`enable\nconfigure terminal\ninterface gigabitEthernet 0/0\nip address 192.168.1.1 255.255.255.0\nno shutdown\nexit\ninterface gigabitEthernet 0/1\nip address 192.168.2.1 255.255.255.0\nno shutdown\nend\nshow ip interface brief`);return ''}
function classPage(c){return `<div class="class-head"><h1>CLASE ${c.n} — ${c.t}</h1><div class="meta"><span class="pill">${c.ra}</span><span class="pill">4 horas</span><span class="pill">Guía paso a paso</span></div><p><b>Objetivo:</b> ${c.o}</p></div><div class="section"><h2>¿Qué aprenderán?</h2><p>${c.c}</p><h2>¿Qué necesito antes de comenzar?</h2><p>${c.m}</p><h2>Preparación del profesor</h2><ol class="steps"><li>Prueba la actividad completa y guarda una copia limpia.</li><li>Prepara equipos, material, proyector y carpeta de evidencias.</li><li>Escribe el objetivo, la topología y la convención de nombres.</li></ol><div class="checklist">${check('Preparé equipos y materiales',`c${c.n}a`)}${check('Probé la demostración',`c${c.n}b`)}${check('Preparé la evidencia',`c${c.n}c`)}</div></div><div class="two"><div class="section"><h2>Inicio — 15 min</h2><h3>Qué decir</h3><div class="callout">“${c.c}”</div><h3>Pregunta inicial</h3><p>¿Qué problema de una red cotidiana se parece a lo que veremos hoy?</p></div><div class="section"><h2>Distribución sugerida</h2><table><tr><td>Activación</td><td>15 min</td></tr><tr><td>Teoría</td><td>30 min</td></tr><tr><td>Demostración</td><td>45 min</td></tr><tr><td>Práctica</td><td>90 min</td></tr><tr><td>Cierre</td><td>30 min</td></tr></table></div></div><div class="section"><h2>Desarrollo paso a paso</h2><ol class="steps"><li>Abre Packet Tracer y crea un proyecto nuevo.</li><li>Agrega los dispositivos indicados desde Network Devices y End Devices.</li><li>Conecta los equipos desde Connections usando el cable apropiado.</li><li>Configura cada equipo desde CLI, Config o Desktop.</li><li>Comprueba cada cambio con ping, ipconfig o un comando show.</li><li>Guarda el archivo como <code>Apellido_Nombre_Clase${c.n}.pkt</code>.</li></ol><h3>Topología de referencia</h3><div class="diagram">${esc(c.d)}</div>${baseCode(c)}<div class="callout good"><b>Observación docente:</b> el estudiante debe explicar qué dispositivo configura, en qué puerto, con qué dirección y qué evidencia demuestra que funciona.</div></div><div class="section"><h2>Actividad práctica</h2><p>${c.a}</p><h3>Guardar evidencia</h3><p>Solicita capturas de la topología, configuración y pruebas realizadas.</p><div class="checklist">${check('Completé la topología o montaje',`c${c.n}d`)}${check('Realicé las pruebas',`c${c.n}e`)}${check('Guardé evidencias',`c${c.n}f`)}</div></div><div class="section"><h2>¿Cómo sé que funcionó?</h2><div class="callout good">${c.v}</div><h2>Error intencional y diagnóstico</h2><p>${c.f}</p><ol class="steps"><li><b>Detectar:</b> describir exactamente qué no funciona.</li><li><b>Hipótesis:</b> cable, IP, máscara, puerto, VLAN, servicio o credenciales.</li><li><b>Comprobar:</b> utilizar LEDs, ipconfig, ping o show.</li><li><b>Corregir y repetir:</b> guardar evidencia antes y después.</li></ol></div><div class="section"><h2>Preguntas de verificación</h2><ol><li>¿Qué función cumple cada dispositivo utilizado?</li><li>¿Qué indicador demuestra que funcionó?</li><li>¿La falla es física o lógica?</li><li>¿Qué comprobarías primero?</li></ol><h2 class="teacher-only">Respuesta esperada</h2><p class="teacher-only">La explicación debe conectar síntoma, hipótesis, prueba y corrección.</p><div class="callout">Hoy no solo configuramos: aprendimos a comprobar y diagnosticar.</div></div><div class="class-nav"><button class="btn secondary" onclick="showClass(${Math.max(1,c.n-1)})">← Anterior</button><button class="btn primary" onclick="showClass(${Math.min(18,c.n+1)})">Siguiente →</button></div>`}
function home(){return `<div class="hero"><h1>GUÍA DOCENTE DE REDES</h1><p>TNS en Tecnologías Digitales y Ciberseguridad · manual práctico para enseñar, demostrar y evaluar.</p></div><div class="stats"><div class="stat"><strong>18</strong><span>Clases</span></div><div class="stat"><strong>4 h</strong><span>Por clase</span></div><div class="stat"><strong>3</strong><span>Resultados de aprendizaje</span></div><div class="stat"><strong>3</strong><span>Evaluaciones</span></div></div><div class="grid"><div class="card ra1"><h3>RA1 · Redes e IPv4</h3><p>Clases 1–5: direccionamiento, subredes, router, DHCP y diagnóstico.</p><button class="btn primary" onclick="showClass(1)">Entrar</button></div><div class="card ra2"><h3>RA2 · Cableado y switching</h3><p>Clases 6–11: UTP, tester, rack, VLAN y trunk.</p><button class="btn primary" onclick="showClass(6)">Entrar</button></div><div class="card ra3"><h3>RA3 · Wi‑Fi y seguridad</h3><p>Clases 12–18: AP, WPA, control de acceso, RADIUS y hardening.</p><button class="btn primary" onclick="showClass(12)">Entrar</button></div></div><div class="section"><h2>Ruta rápida para preparar una clase</h2><ol class="steps"><li>Selecciona una clase en el menú.</li><li>Marca la checklist de preparación.</li><li>Realiza la demostración antes de entregar la práctica.</li><li>Introduce una falla controlada.</li><li>Solicita evidencias y guarda la pauta.</li></ol></div>`}
function tools(){return `<div class="section"><h2>Packet Tracer desde cero</h2><p>Simulador educativo para representar dispositivos, puertos, cables y comandos básicos.</p><ol class="steps"><li>Abre Packet Tracer y selecciona File → New.</li><li>Agrega routers, switches y PCs desde la barra inferior.</li><li>Conecta los equipos desde Connections.</li><li>Configura las PCs en Desktop → IP Configuration.</li><li>Configura routers y switches desde CLI.</li><li>Comprueba con ipconfig, ping, tracert y comandos show.</li><li>Guarda el proyecto usando File → Save As.</li></ol><h3>Comandos esenciales</h3>${code('ipconfig\nping 192.168.1.1\ntracert 192.168.2.10')}<h2>Comandos Packet Tracer</h2><table><tr><th>Comando</th><th>Función</th></tr>${commands.map(x=>`<tr><td>${code(x)}</td><td>${commandInfo(x)}</td></tr>`).join('')}</table></div>`}
function commandInfo(x){return ({'enable':'Entrar al modo privilegiado.','configure terminal':'Entrar a configuración global.','show running-config':'Ver la configuración activa.','show ip interface brief':'Revisar estado e IP de interfaces.','show vlan brief':'Ver VLAN y puertos.','show interfaces trunk':'Ver trunks activos.','show ip route':'Ver rutas conocidas.','show arp':'Ver asociaciones IP-MAC.','copy running-config startup-config':'Guardar la configuración.'})[x]||''}
function evaluations(){return `<div class="section"><h2>Evaluaciones</h2><div class="card ra1"><h3>Evaluación 1 · RA1</h3><p>Diseñar VLSM, configurar router y DHCP, demostrar ping/tracert y diagnosticar una falla.</p></div><div class="card ra2"><h3>Evaluación 2 · RA2</h3><p>Fabricar cable, obtener PASS en tester, crear VLAN10/20 y trunk 802.1Q.</p></div><div class="card ra3"><h3>Evaluación 3 · RA3</h3><p>Auditar AP: SSID, canal, WPA2/WPA3, WPS, MAC, Guest, Isolation y RADIUS.</p></div><h3>Criterios comunes</h3><table><tr><th>Criterio</th><th>Ponderación</th></tr><tr><td>Configuración técnica</td><td>35%</td></tr><tr><td>Diagnóstico y justificación</td><td>25%</td></tr><tr><td>Evidencias</td><td>20%</td></tr><tr><td>Orden y seguridad</td><td>20%</td></tr></table></div>`}
function checklist(){let xs=['Packet Tracer instalado','Computadores funcionando','Switches disponibles','Routers disponibles','AP disponibles','Cable UTP','RJ-45','Crimpadora','Tester','Patch Panel','Rack','Analizador Wi-Fi','Servidor RADIUS','Material de evaluación'];return `<div class="section"><h2>Checklist general del profesor</h2><p>Las marcas se guardan automáticamente en este navegador.</p><div class="checklist">${xs.map((x,i)=>check(x,'general'+i)).join('')}</div></div>`}
function renderNav(){let groups=[['home','Inicio'],['ra1','RA1 · Redes e IPv4'],['ra2','RA2 · Cableado y switching'],['ra3','RA3 · Wi‑Fi y seguridad'],['all','Todas las clases'],['eval','Evaluaciones'],['tools','Packet Tracer y herramientas'],['check','Checklist']];document.getElementById('nav').innerHTML='<div class="nav-title">Navegación</div>'+groups.map(x=>`<button data-nav="${x[0]}" onclick="navigate('${x[0]}')">${x[1]}</button>`).join('')+'<div class="nav-title">Clases</div>'+classes.map(c=>`<button onclick="showClass(${c.n})">Clase ${c.n} · ${c.t.split(':')[0]}</button>`).join('')}
function loadChecks(){document.querySelectorAll('[data-check]').forEach(i=>{i.checked=localStorage.getItem(i.dataset.check)==='1';i.onchange=()=>localStorage.setItem(i.dataset.check,i.checked?'1':'0')})}
function navigate(x){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===x));let title=x==='home'?'Inicio':x==='tools'?'Packet Tracer y herramientas':x==='check'?'Checklist':x==='eval'?'Evaluaciones':'Contenido';document.getElementById('pageTitle').textContent=title;let out=x==='home'?home():x==='tools'?tools():x==='eval'?evaluations():x==='check'?checklist():x==='all'?classes.map(c=>`<div class="card"><h3>Clase ${c.n} — ${c.t}</h3><p>${c.ra}</p><button class="btn primary" onclick="showClass(${c.n})">Abrir clase</button></div>`).join(''):classes.filter(c=>c.ra.toLowerCase()===x).map(c=>`<div class="card"><h3>Clase ${c.n} — ${c.t}</h3><p>${c.o}</p><button class="btn primary" onclick="showClass(${c.n})">Abrir clase</button></div>`).join('');document.getElementById('content').innerHTML=out||'<div class="empty">No hay resultados.</div>';loadChecks();window.scrollTo(0,0)}
function showClass(n){let c=classes.find(x=>x.n===Number(n));document.getElementById('pageTitle').textContent='Clase '+n;document.getElementById('content').innerHTML=classPage(c);document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));loadChecks();window.scrollTo(0,0)}
function copyCode(btn){let text=[...btn.parentElement.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join('').trim();navigator.clipboard.writeText(text);btn.textContent='COPIADO';setTimeout(()=>btn.textContent='COPIAR',1200)}
document.getElementById('modeBtn').onclick=()=>{document.body.classList.toggle('student-mode');let on=document.body.classList.contains('student-mode');document.getElementById('modeBtn').textContent=on?'Modo profesor':'Modo estudiante'};
document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase().trim();if(!q){navigate('home');return}let hits=classes.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q));document.getElementById('pageTitle').textContent='Resultados de búsqueda';document.getElementById('content').innerHTML=hits.length?hits.map(c=>`<div class="card"><h3>Clase ${c.n} — ${c.t}</h3><p>${c.ra} · Coincidencia encontrada</p><button class="btn primary" onclick="showClass(${c.n})">Abrir clase</button></div>`).join(''):'<div class="empty">No se encontraron coincidencias.</div>'};
renderNav();navigate('home');
</script>
</body>
</html>
